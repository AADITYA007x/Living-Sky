[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# Used by "npx netlify-cli dev" to run the site and the chat function together locally
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
