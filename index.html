<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#03050b" />
    <meta name="description" content="An interactive map of the night sky." />
    <title>Living Sky</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
    />
  </head>
  <body>
    <canvas id="sky" aria-label="Interactive star map"></canvas>
    <div class="labels" aria-hidden="true"></div>

    <h1 class="title">Living Sky</h1>
    <p class="hint">Drag to look around, scroll or pinch to zoom, and select any star.</p>
    <p class="status" role="status"></p>

    <button class="toggle-lines" type="button" aria-pressed="false" hidden>
      <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
        <path d="M3 14l5-7 4 4 5-8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round" />
        <circle cx="3" cy="14" r="1.4" fill="currentColor" />
        <circle cx="8" cy="7" r="1.4" fill="currentColor" />
        <circle cx="12" cy="11" r="1.4" fill="currentColor" />
        <circle cx="17" cy="3" r="1.4" fill="currentColor" />
      </svg>
      <span>Constellation lines</span>
    </button>

    <div class="ring" aria-hidden="true"><span></span></div>
    <aside class="panel" aria-label="Star details"></aside>

    <p class="credits">
      <a href="https://www.astronexus.com/projects/hyg" target="_blank" rel="noopener">Stars: HYG v4.2, CC BY-SA 4.0</a>
      <a href="https://github.com/ofrohn/d3-celestial" target="_blank" rel="noopener">Constellations: d3-celestial, BSD</a>
    </p>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
